<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>KABALIKAT Bills Details</title>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>

    <link href="bills-details.css" rel="stylesheet"/>
</head>
<body data-page="bills-details">
<main class="detail-page-shell">
    <div class="detail-page-scroll">
        <header class="detail-page-header">
            <button aria-label="Back to Bills and Debt" class="detail-page-back" id="backToBills" type="button">
                <i class="bi bi-arrow-left"></i>
            </button>
            <div>
                <h1>Bills Details</h1>
                <p>Review active and completed household bills.</p>
            </div>
        </header>
        <button aria-controls="detailsMonthPicker" aria-haspopup="dialog" class="detail-month-button" id="detailsMonthButton" type="button">
            <span id="detailsMonthLabel">Month Year</span>
            <i class="bi bi-calendar3"></i>
        </button>
        <section aria-label="Bills summary" class="detail-summary-card">
            <span id="detailsSummaryLabel">Total Bills</span>
            <strong id="detailsSummaryAmount">₱0</strong>
            <small id="detailsSummaryCount">0 remaining · 0 paid</small>
        </section>
        <section aria-label="Filter bills by status" class="detail-segmented-filter" role="group">
            <button class="active" data-status-filter="all" type="button">All</button><button data-status-filter="active" type="button">Active</button><button data-status-filter="paid" type="button">Paid</button></section>
        <section class="detail-section">
            <div class="detail-section-heading">
                <h2>Category Breakdown</h2>
                <button id="toggleCategories" type="button">View All</button>
            </div>
            <div class="category-grid" id="categoryGrid"></div>
        </section>
        <section class="detail-section">
            <div class="detail-section-heading">
                <h2>Bill Records</h2>
                <span id="billRecordCount">0 records</span>
            </div>
            <div class="active-category-notice" hidden="" id="activeCategoryNotice">
                <span id="activeCategoryText">Category</span>
                <button id="clearCategoryFilter" type="button">Clear</button>
            </div>
            <div class="bill-records-list" id="billRecordsList"></div>
        </section>
    </div>
</main>
<div class="month-picker" hidden="" id="detailsMonthPicker">
    <button aria-label="Close month selector" class="month-picker-backdrop" id="detailsMonthBackdrop" type="button"></button>
    <section aria-labelledby="detailsMonthPickerTitle" aria-modal="true" class="month-picker-sheet" role="dialog">
        <div class="month-picker-handle"></div>
        <header>
            <div>
                <span>View bills from</span>
                <h2 id="detailsMonthPickerTitle">Select month and year</h2>
            </div>
            <button aria-label="Close month selector" id="closeDetailsMonthPicker" type="button">
                <i class="bi bi-x-lg"></i>
            </button>
        </header>
        <div class="month-picker-fields">
            <label>
                Month
                <select id="detailsMonthSelect"></select>
            </label>
            <label>
                Year
                <select id="detailsYearSelect"></select>
            </label>
        </div>
        <div class="month-picker-actions">
            <button id="cancelDetailsMonthPicker" type="button">Cancel</button>
            <button id="applyDetailsMonthPicker" type="button">View Month</button>
        </div>
    </section>
</div>
<div aria-live="polite" class="detail-toast" id="detailsToast" role="status"></div>

<script src="bills-details.js"></script>
</body>
</html>

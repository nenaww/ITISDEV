<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Create Goal
</title>


<link rel="stylesheet" href="add-goal.css">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>


<div class="app">



<header class="header">


<button onclick="history.back()">

<i class="bi bi-arrow-left"></i>

</button>



<div>

<h1>
Create Goal
</h1>


<p>
What is your family saving for?
</p>


</div>


</header>







<section class="card">


<h3>
Choose Goal Type
</h3>




<div class="goal-grid">


<button onclick="selectType(this,'Holiday')">


<i class="bi bi-gift"></i>

Holiday


</button>




<button onclick="selectType(this,'Education')">


<i class="bi bi-book"></i>

Education


</button>




<button onclick="selectType(this,'Home')">


<i class="bi bi-house"></i>

Home


</button>




<button onclick="selectType(this,'Vacation')">


<i class="bi bi-airplane"></i>

Vacation


</button>




<button onclick="selectType(this,'Custom')">


<i class="bi bi-plus-circle"></i>

Custom


</button>



</div>




<input
id="customType"
class="hidden"
placeholder="Enter goal type">


</section>








<section class="card">


<h3>
Goal Details
</h3>




<label>
Goal Name
</label>


<input
id="goalName"
placeholder="Example: Christmas Fund">





<label>
Target Amount
</label>


<div class="money-input">


<span>
₱
</span>


<input
id="targetAmount"
type="number"
placeholder="0">


</div>






<label>
Initial Savings
</label>


<div class="money-input">


<span>
₱
</span>


<input
id="initialSavings"
type="number"
placeholder="0">


</div>



</section>








<button
class="create-btn"
onclick="createGoal()">


Create Goal


</button>





</div>




<script src="add-goal.js"></script>


</body>

</html>

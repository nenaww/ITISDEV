<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>
        KABALIKAT Secure Vault
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="secure-vault.css">
</head>
<body data-page="secure-vault">
<main class="vault-page">
    <div class="vault-scroll-area">
        <header class="vault-header">
            <button id="vaultBackButton" class="vault-header-button" type="button">
                <i class="bi bi-arrow-left">
                </i>
            </button>
            <div>
                <h1>
                    Secure Vault
                </h1>
            </div>
            <button id="vaultAddButton" class="vault-header-button primary" type="button">
                <i class="bi bi-plus-lg">
                </i>
            </button>
        </header>
        <div class="vault-search">
            <i class="bi bi-search" aria-hidden="true"></i>

            <label class="vault-visually-hidden" for="vaultSearchInput">
                Search files
            </label>

            <input id="vaultSearchInput" type="search" placeholder="Search files" autocomplete="off">

            <button id="clearVaultSearch" type="button" aria-label="Clear search" hidden>
                <i class="bi bi-x-circle-fill" aria-hidden="true"></i>
            </button>
        </div>
        <section class="vault-card vault-overview-card">
            <div class="vault-section-head">
                <div>

                    <h2>Vault Overview</h2>
                </div>
            </div>

            <div class="vault-summary">
                <button id="vaultOverviewFiles" class="vault-summary-item" type="button">
                    <span class="vault-summary-icon files">
                        <i class="bi bi-file-earmark-text"></i>
                    </span>
                    <strong id="vaultTotalCount">0</strong>
                    <small>Files</small>
                </button>

                <button id="vaultOverviewFolders" class="vault-summary-item" type="button">
                    <span class="vault-summary-icon folders">
                        <i class="bi bi-folder"></i>
                    </span>
                    <strong id="vaultFolderCount">0</strong>
                    <small>Folders</small>
                </button>

                <button id="vaultOverviewFavorites" class="vault-summary-item" type="button">
                    <span class="vault-summary-icon favorites">
                        <i class="bi bi-heart"></i>
                    </span>
                    <strong id="vaultFavoriteCount">0</strong>
                    <small>Favorites</small>
                </button>
            </div>
        </section>

        <div class="vault-view-toggle vault-view-toggle-main" role="group" aria-label="Choose list or grid view">
            <button id="vaultListViewButton" type="button" aria-label="Use list view">
                <i class="bi bi-list-ul"></i>
            </button>

            <button id="vaultGridViewButton" type="button" aria-label="Use grid view">
                <i class="bi bi-grid"></i>
            </button>
        </div>

        <section class="vault-section">
            <div class="vault-section-head">
                <div>

                    <h2>
                        Folders
                    </h2>
                </div>
                <button id="vaultFoldersViewAll" class="vault-text-button" type="button">
                    View all
                </button>
            </div>
            <div id="vaultFolderGrid" class="vault-folder-grid">
            </div>
        </section>
        <section class="vault-section">
            <div class="vault-section-head">
                <div>

                    <h2 id="vaultFilesHeading">
                        Recent Files
                    </h2>
                </div>
                <div class="vault-files-head-actions">
                    <strong id="vaultVisibleCount">
                        0 items
                    </strong>

                    <button id="vaultFilesViewAll" class="vault-text-button" type="button">
                        View all
                    </button>
                </div>
            </div>
            <div id="vaultFileList" class="vault-file-list">
            </div>
        </section>
    </div>

    <section id="vaultBrowserPage" class="vault-browser-page" hidden>
        <header class="vault-browser-header">
            <button id="vaultBrowserBackButton" class="vault-browser-header-button" type="button" aria-label="Return to Secure Vault">
                <i class="bi bi-arrow-left"></i>
            </button>

            <h1 id="vaultBrowserTitle">Files</h1>

            <button id="vaultBrowserMenuButton" class="vault-browser-header-button" type="button" aria-label="Open Trash">
                <i class="bi bi-trash3"></i>
            </button>
        </header>

        <div class="vault-browser-tools">
            <button id="vaultBrowserSortButton" class="vault-browser-sort" type="button">
                <span>
                    <small>Sort &amp; filter</small>
                    <strong id="vaultBrowserSortLabel">Date modified</strong>
                </span>

                <i class="bi bi-chevron-down"></i>
            </button>

            <div class="vault-view-toggle vault-browser-view-toggle" role="group" aria-label="Choose list or grid view">
                <button id="vaultBrowserListViewButton" type="button" aria-label="Use list view">
                    <i class="bi bi-list-ul"></i>
                </button>

                <button id="vaultBrowserGridViewButton" type="button" aria-label="Use grid view">
                    <i class="bi bi-grid"></i>
                </button>
            </div>
        </div>

        <nav
                id="vaultBrowserBreadcrumb"
                class="vault-browser-breadcrumb"
                aria-label="Folder path"
                hidden
        ></nav>

        <div id="vaultBrowserContent" class="vault-browser-content"></div>

        <button id="vaultBrowserAddButton" class="vault-browser-add-button" type="button" aria-label="Add to Secure Vault">
            <i class="bi bi-plus-lg"></i>
        </button>
    </section>

    <nav class="vault-bottom-nav">
        <button id="vaultNavHome">
            <i class="bi bi-house">
            </i>
            <span>
                        Home
                    </span>
        </button>
        <button id="vaultNavExpenses">
            <i class="bi bi-receipt">
            </i>
            <span>
                        Expenses
                    </span>
        </button>
        <button id="vaultNavScan" class="scan">
            <i class="bi bi-upc-scan">
            </i>
        </button>
        <button id="vaultNavBills">
            <i class="bi bi-calendar-check">
            </i>
            <span>
                        Bills
                    </span>
        </button>
        <button id="vaultNavSavings">
            <i class="bi bi-piggy-bank">
            </i>
            <span>
                        Savings
                    </span>
        </button>
    </nav>
</main>
<div id="vaultAddBackdrop" class="vault-overlay" hidden>
</div>
<section id="vaultAddSheet" class="vault-sheet" hidden>
    <div class="vault-handle">
    </div>
    <header>
        <div>
                    <span>
                        FAMILY VAULT
                    </span>
            <h2>
                Add to Vault
            </h2>
        </div>
        <button id="closeVaultAddSheet">
            <i class="bi bi-x-lg">
            </i>
        </button>
    </header>
    <div class="vault-actions">
        <button id="vaultScanReceiptOption">
            <i class="bi bi-upc-scan">
            </i>
            <span>
                        <strong>
                            Scan Receipt
                        </strong>
                        <small>
                            Scan and save automatically
                        </small>
                    </span>
        </button>
        <button id="vaultUploadReceiptOption">
            <i class="bi bi-image">
            </i>
            <span>
                        <strong>
                            Upload Receipt
                        </strong>
                        <small>
                            Select an image
                        </small>
                    </span>
        </button>
        <button id="vaultUploadDocumentOption">
            <i class="bi bi-file-earmark-arrow-up">
            </i>
            <span>
                        <strong>
                            Upload Document
                        </strong>
                        <small>
                            Add an image or PDF
                        </small>
                    </span>
        </button>
        <button id="vaultNewFolderOption">
            <i class="bi bi-folder-plus">
            </i>
            <span>
                        <strong>
                            New Folder
                        </strong>
                        <small>
                            Organize family files
                        </small>
                    </span>
        </button>
    </div>
    <input id="vaultReceiptUploadInput" type="file" accept="image/*" hidden>
    <input id="vaultDocumentUploadInput" type="file" accept="image/*,application/pdf" hidden>
</section>
<div id="vaultAllFoldersBackdrop" class="vault-overlay" hidden></div>

<section id="vaultAllFoldersSheet" class="vault-sheet vault-all-folders-sheet" hidden>
    <div class="vault-handle"></div>

    <header>
        <div>

            <h2>All Folders</h2>
        </div>

        <button id="closeVaultAllFoldersSheet" type="button" aria-label="Close all folders">
            <i class="bi bi-x-lg"></i>
        </button>
    </header>

    <button id="vaultCreateFolderButton" class="vault-all-folders-create" type="button">
        <span>
            <i class="bi bi-folder-plus"></i>
        </span>

        <span class="vault-all-folders-create-copy">
            <strong>New Folder</strong>
            <small>Add a new folder</small>
        </span>

        <i class="bi bi-chevron-right"></i>
    </button>

    <div id="vaultAllFoldersList" class="vault-all-folders-list"></div>
</section>

<div id="vaultFolderBackdrop" class="vault-overlay" hidden>
</div>
<section id="vaultFolderSheet" class="vault-sheet" hidden>
    <div class="vault-handle">
    </div>
    <header>
        <div>

            <h2 id="vaultFolderSheetTitle">
                Create Folder
            </h2>

            <p id="vaultFolderLocationText" class="vault-folder-location-text">
                Create in Family Vault
            </p>
        </div>
        <button id="closeVaultFolderSheet">
            <i class="bi bi-x-lg">
            </i>
        </button>
    </header>
    <label class="vault-field">
        Folder Name
        <input id="vaultFolderNameInput" type="text" maxlength="40" placeholder="Example: School Receipts">
    </label>
    <button id="saveVaultFolderButton" class="vault-primary-button">
        Create Folder
    </button>
</section>
<div id="vaultFileOptionsBackdrop" class="vault-overlay" hidden>
</div>
<section id="vaultFileOptionsSheet" class="vault-sheet" hidden>
    <div class="vault-handle">
    </div>
    <h3 id="vaultOptionsFileName">
        File
    </h3>
    <p id="vaultOptionsFileMeta">
    </p>
    <div class="vault-actions">
        <button id="vaultPreviewOption">
            <i class="bi bi-info-circle">
            </i>
            <span>
                        <strong>
                            View Details
                        </strong>
                    </span>
        </button>
        <button id="vaultRenameOption">
            <i class="bi bi-pencil">
            </i>
            <span>
                        <strong>
                            Rename
                        </strong>
                    </span>
        </button>
        <button id="vaultMoveOption">
            <i class="bi bi-folder2-open">
            </i>
            <span>
                        <strong>
                            Move to Folder
                        </strong>
                    </span>
        </button>
        <button id="vaultFavoriteOption">
            <i class="bi bi-heart"></i>
            <span>
                <strong id="vaultFavoriteOptionText">Add to Favorites</strong>
            </span>
        </button>

        <button id="vaultDownloadOption">
            <i class="bi bi-download"></i>
            <span>
                <strong>Download</strong>
            </span>
        </button>
        <button id="vaultTrashOption" class="danger">
            <i class="bi bi-trash3">
            </i>
            <span>
                        <strong>
                            Delete File
                        </strong>
                    </span>
        </button>
    </div>
</section>
<div id="vaultRenameBackdrop" class="vault-overlay" hidden>
</div>
<section id="vaultRenameSheet" class="vault-sheet" hidden>
    <div class="vault-handle">
    </div>
    <header>
        <div>
                    <span>
                        FILE
                    </span>
            <h2>
                Rename File
            </h2>
        </div>
        <button id="closeVaultRenameSheet">
            <i class="bi bi-x-lg">
            </i>
        </button>
    </header>
    <label class="vault-field">
        File Name
        <input id="vaultRenameInput" type="text">
    </label>
    <button id="saveVaultRenameButton" class="vault-primary-button">
        Save Name
    </button>
</section>
<div id="vaultMoveBackdrop" class="vault-overlay" hidden>
</div>
<section id="vaultMoveSheet" class="vault-sheet" hidden>
    <div class="vault-handle">
    </div>
    <header>
        <div>

            <h2>
                Move to Folder
            </h2>
        </div>
        <button id="closeVaultMoveSheet">
            <i class="bi bi-x-lg">
            </i>
        </button>
    </header>
    <div id="vaultMoveFolderList" class="vault-actions">
    </div>
</section>
<section id="vaultPreviewPage" class="vault-viewer-page" hidden>
    <header class="vault-viewer-header">
        <button id="closeVaultPreviewPage" class="vault-viewer-header-button" type="button" aria-label="Go back">
            <i class="bi bi-arrow-left"></i>
        </button>

        <h2 id="vaultPreviewTitle">File</h2>

        <span class="vault-viewer-header-spacer" aria-hidden="true"></span>
    </header>

    <div class="vault-viewer-scroll">
        <div id="vaultPreviewVisual" class="vault-viewer-visual"></div>

        <section class="vault-viewer-info">
            <h3 id="vaultViewerFileName">File</h3>
            <p id="vaultViewerFileMeta">Document</p>
        </section>

        <div class="vault-viewer-actions">
            <button id="vaultViewerShareButton" type="button">
                <i class="bi bi-share"></i>
                <span>Share</span>
            </button>

            <button id="vaultViewerDownloadButton" type="button">
                <i class="bi bi-download"></i>
                <span>Download</span>
            </button>

            <button id="vaultViewerFavoriteButton" type="button">
                <i class="bi bi-heart"></i>
                <span>Favorites</span>
            </button>

            <button id="vaultViewerMoreActionButton" type="button">
                <i class="bi bi-three-dots"></i>
                <span>More</span>
            </button>
        </div>

        <section id="vaultPreviewContent" class="vault-viewer-details"></section>
    </div>
</section>
<div id="vaultTrashBackdrop" class="vault-overlay" hidden>
</div>
<section id="vaultTrashSheet" class="vault-sheet" hidden>
    <div class="vault-handle">
    </div>
    <header>
        <div>
                    <span>
                        RECOVERY
                    </span>
            <h2>
                Trash
            </h2>
        </div>
        <button id="closeVaultTrashSheet">
            <i class="bi bi-x-lg">
            </i>
        </button>
    </header>
    <div id="vaultTrashList" class="vault-file-list">
    </div>
    <button id="emptyVaultTrashButton" class="vault-danger-button">
        Empty Trash
    </button>
</section>


<div id="vaultFolderOptionsBackdrop" class="vault-overlay" hidden></div>

<section id="vaultFolderOptionsSheet" class="vault-sheet" hidden>
    <div class="vault-handle"></div>

    <header>
        <div>

            <h2 id="vaultFolderOptionsTitle">Folder options</h2>
        </div>

        <button id="closeVaultFolderOptionsSheet" type="button" aria-label="Close folder options">
            <i class="bi bi-x-lg"></i>
        </button>
    </header>

    <div class="vault-folder-options-list">
        <button id="openSelectedFolderButton" type="button">
            <i class="bi bi-folder2-open"></i>
            <span><strong>Open Folder</strong></span>
        </button>

        <button id="deleteSelectedFolderButton" class="danger" type="button">
            <i class="bi bi-trash3"></i>
            <span><strong>Delete Folder</strong></span>
        </button>
    </div>
</section>

<div id="vaultSortBackdrop" class="vault-overlay" hidden></div>

<section id="vaultSortSheet" class="vault-sheet vault-sort-sheet" hidden>
    <div class="vault-handle"></div>

    <header>
        <div>
            <h2>Sort &amp; Filter</h2>
        </div>

        <button id="closeVaultSortSheet" type="button" aria-label="Close sort and filter options">
            <i class="bi bi-x-lg"></i>
        </button>
    </header>

    <section class="vault-sort-filter-group">
        <h3>Sort by</h3>

        <div class="vault-sort-options">
            <button type="button" data-vault-sort="date">
                <i class="bi bi-clock-history"></i>
                <span>Date modified</span>
                <i class="bi bi-check-lg"></i>
            </button>

            <button type="button" data-vault-sort="name">
                <i class="bi bi-sort-alpha-down"></i>
                <span>Name</span>
                <i class="bi bi-check-lg"></i>
            </button>

            <button type="button" data-vault-sort="favorite">
                <i class="bi bi-heart"></i>
                <span>Favorites first</span>
                <i class="bi bi-check-lg"></i>
            </button>
        </div>
    </section>

    <section id="vaultFileTypeFilterGroup" class="vault-sort-filter-group">
        <h3>File type</h3>

        <div id="vaultTypeFilterOptions" class="vault-filter-chips" role="group" aria-label="Filter by file type">
            <button type="button" data-vault-file-type="all">All files</button>
            <button type="button" data-vault-file-type="receipt">Receipts</button>
            <button type="button" data-vault-file-type="warranty">Warranties</button>
            <button type="button" data-vault-file-type="document">Documents</button>
        </div>
    </section>

    <section id="vaultMemberFilterGroup" class="vault-sort-filter-group">
        <h3>Family member</h3>

        <button id="vaultMemberFilterButton" class="vault-member-filter-button" type="button">
            <span>
                <small>Uploaded by</small>
                <strong id="vaultMemberFilterLabel">All members</strong>
            </span>

            <i class="bi bi-chevron-down"></i>
        </button>

        <div id="vaultMemberFilterOptions" class="vault-member-filter-options" hidden></div>
    </section>
</section>

<div id="vaultToast" class="vault-toast">
</div>
<script src="auth-service.js">
</script>
<script src="vault-service.js">
</script>
<script src="secure-vault.js">
</script>
</body>
</html>

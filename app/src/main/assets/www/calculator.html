<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KABALIKAT Budget Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="calculator.css">

</head>


<body>

<main class="planner">


<header class="header">

<button onclick="history.back()">
←
</button>

<div>
<h1>Budget Planner</h1>
<p>Plan your money for this month</p>
</div>

</header>



<section class="card">

<h2>Available Money</h2>


<label>
Monthly Income
</label>

<div class="input-box">

<span>₱</span>

<input id="income"
type="number"
placeholder="25000">

</div>



<label>
Other Income (Optional)
</label>

<div class="input-box">

<span>₱</span>

<input id="otherIncome"
type="number"
placeholder="0">

</div>



<div class="summary-highlight">

<span>
Available Money
</span>

<strong id="available">
₱0
</strong>

</div>


</section>





<section class="card">

<h2>Household Needs</h2>


<div class="expense-item">

<label>
Food & Groceries
</label>

<input id="food"
type="number"
placeholder="0">

</div>



<div class="expense-item">

<label>
Bills & Utilities
</label>

<input id="bills"
type="number"
placeholder="0">

</div>



<div class="expense-item">

<label>
Transportation
</label>

<input id="transport"
type="number"
placeholder="0">

</div>



<div class="expense-item">

<label>
Rent
</label>

<input id="rent"
type="number"
placeholder="0">

</div>


</section>





<section class="card">


<h2>Family Needs</h2>


<div class="expense-item">

<label>
Children / Family Allocation
</label>

<input id="family"
type="number"
placeholder="0">

</div>


</section>





<section class="card">


<h2>Future Plans</h2>



<div class="expense-item">

<label>
Savings
</label>

<input id="savings"
type="number"
placeholder="0">

</div>




<div class="expense-item">

<label>
Emergency Fund
</label>

<input id="emergency"
type="number"
placeholder="0">

</div>



</section>






<section class="card summary">


<h2>Your Budget Plan</h2>



<div class="summary-row">

<span>
Available Money
</span>

<strong id="summaryAvailable">
₱0
</strong>

</div>



<div class="summary-row">

<span>
Planned Spending
</span>

<strong id="planned">
₱0
</strong>

</div>



<div class="summary-row">

<span>
Savings
</span>

<strong id="saved">
₱0
</strong>

</div>



<div class="summary-row">

<span>
Remaining
</span>

<strong id="remaining">
₱0
</strong>

</div>




<p id="message"></p>



</section>




<button id="reset"
class="reset">

Reset Plan

</button>



</main>


<script src="calculator.js"></script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KABALIKAT Budget Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="calculator.css">
</head>
<body>
<main class="page">
<header>
<button onclick="history.back()">←</button>
<div><h1>Budget Calculator</h1><p>Plan your household budget before allocating your money.</p></div>
</header>

<section class="card">
<h2>Available Money</h2>
<label>Monthly Income</label>
<div class="input"><span>₱</span><input id="income" type="number" placeholder="25000"></div>
<label>Additional Income</label>
<div class="input"><span>₱</span><input id="extra" type="number" placeholder="0"></div>
<div class="total"><span>Total Available</span><b id="total">₱0</b></div>
</section>

<section class="card">
<div class="title"><h2>Budget Split</h2><b id="percent">100%</b></div>

<div class="category peach"><span>Needs<br><b id="needsAmount">₱0</b></span><input id="needs" value="60">%</div>
<div class="category purple"><span>Savings<br><b id="saveAmount">₱0</b></span><input id="save" value="20">%</div>
<div class="category blue"><span>Emergency<br><b id="emergencyAmount">₱0</b></span><input id="emergency" value="10">%</div>
<div class="category yellow"><span>Others<br><b id="othersAmount">₱0</b></span><input id="others" value="10">%</div>

<p id="warning"></p>
</section>

<section class="card">
<h2>Budget Summary</h2>
<div class="row"><span>Available</span><b id="sumTotal">₱0</b></div>
<div class="row"><span>Allocated</span><b id="allocated">₱0</b></div>
<div class="row"><span>Remaining</span><b id="remaining">₱0</b></div>
</section>

<section class="card">
<h2>Suggested Plans</h2>
<div class="buttons">
<button id="balanced">Balanced</button>
<button id="focused">Savings Focused</button>
</div>
</section>

<button id="reset">Reset Calculator</button>
</main>
<script src="calculator.js"></script>
</body>
</html>

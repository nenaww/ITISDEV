<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KABALIKAT Secure Vault</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vault-unlock.css">
</head>

<body data-page="vault-unlock">
<main class="vault-unlock-page">
    <div class="vault-unlock-scroll">
        <button id="vaultUnlockBack" class="vault-unlock-back" type="button" aria-label="Go back">
            <i class="bi bi-arrow-left"></i>
        </button>

        <section class="vault-unlock-card" aria-labelledby="vaultUnlockTitle">
            <div class="vault-unlock-visual" aria-hidden="true">
                <span class="vault-unlock-shield">
                    <i class="bi bi-shield-lock-fill"></i>
                </span>
                <span class="vault-unlock-key">
                    <i class="bi bi-key-fill"></i>
                </span>
            </div>

            <div class="vault-unlock-heading">
                <span>SECURE VAULT</span>
                <h1 id="vaultUnlockTitle">Enter your password</h1>
                <p>Confirm your account password before opening your family's protected files.</p>
            </div>

            <div id="vaultUnlockAccount" class="vault-unlock-account" hidden>
                <span class="vault-unlock-avatar" id="vaultUnlockAvatar">FM</span>
                <div>
                    <strong id="vaultUnlockName">Family Member</strong>
                    <small id="vaultUnlockEmail">Signed-in account</small>
                </div>
            </div>

            <form id="vaultUnlockForm" class="vault-unlock-form">
                <label for="vaultPassword">
                    <span>Password</span>
                    <div class="vault-password-field">
                        <i class="bi bi-lock"></i>
                        <input
                            id="vaultPassword"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >
                        <button id="toggleVaultPassword" type="button" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </label>

                <p id="vaultUnlockError" class="vault-unlock-error" role="alert" hidden></p>

                <button id="unlockVaultButton" class="vault-unlock-submit" type="submit">
                    <i class="bi bi-unlock-fill"></i>
                    <span>Unlock Vault</span>
                </button>
            </form>
        </section>
    </div>
</main>

<script src="vault-unlock.js"></script>
</body>
</html>

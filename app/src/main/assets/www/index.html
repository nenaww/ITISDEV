<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABALIKAT</title>
    <style>

            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            background: #EFEFEF;
            font-family: Arial, sans-serif;
            color: #313144;
        }

        .card {
            background: white;

            text-align: center;

        h1 {
            margin: 0;

        p {
            color: #555;
        }

<body>
<div class="card">
    <h1>KABALIKAT</h1>
    <p>WebView is working.</p>

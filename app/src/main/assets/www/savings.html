<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KABALIKAT Savings</title>

<link rel="stylesheet" href="savings.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>


<div class="app">


<!-- HEADER -->

<header class="header">


<div>

<h1>
Savings
</h1>

<p>
Build today, enjoy tomorrow.
</p>

</div>


<button 
onclick="navigate('add-goal.html')">

<i class="bi bi-plus"></i>

Add Goal

</button>


</header>






<!-- SAVINGS OVERVIEW -->


<section class="hero-card">


<div class="hero-title">

<span>
Savings Overview
</span>


</div>



<div class="total">


<h1 id="totalSavings">
₱32,560
</h1>


<p>
Total Family Savings
</p>


</div>




<div class="growth">


<i class="bi bi-arrow-up-right"></i>


<span id="monthlyExcess">

+₱2,350 saved this month

</span>


</div>






<div class="mini-grid">


<div class="mini-card purple">


<i class="bi bi-shield-check"></i>


<div>

<span>
Emergency Fund
</span>


<strong id="emergencyFund">
₱12,000
</strong>


</div>


</div>





<div class="mini-card blue">


<i class="bi bi-bullseye"></i>


<div>

<span>
Active Goals
</span>


<strong id="goalCount">
2 Goals
</strong>


</div>


</div>


</div>


</section>










<!-- 13TH MONTH -->

<section class="card">


<div class="card-header">


<div class="icon green">

<i class="bi bi-gift"></i>

</div>



<div>

<h3>
13th Month Pay
</h3>


<p>
Manage your bonus income
</p>


</div>


</div>







<div class="money-row">


<div>

<span>
Received
</span>


<strong>
₱18,000
</strong>


</div>



<div>

<span>
Moved to Savings
</span>


<strong class="green-text">
₱8,000
</strong>


</div>


</div>





<button onclick="navigate('13th-month.html')">

View Allocation

</button>



</section>









<!-- PLAN MANAGEMENT -->


<h2>
Plan & Manage
</h2>




<div class="actions">



<button onclick="navigate('budget-allocation.html')">


<i class="bi bi-wallet2 purple-icon"></i>



<div>

<strong>
Budget Allocation
</strong>


<small>
Plan this month's funds
</small>


</div>



<i class="bi bi-chevron-right"></i>


</button>







<button onclick="navigate('seasonal-plans.html')">


<i class="bi bi-calendar-event blue-icon"></i>



<div>

<strong>
Seasonal Plans
</strong>


<small>
Prepare future expenses
</small>


</div>



<i class="bi bi-chevron-right"></i>


</button>



</div>









<!-- GOALS -->


<div class="section-title">


<h2>
Active Goals
</h2>


<button onclick="navigate('add-goal.html')">

+ Add

</button>


</div>




<div id="goal-container">


</div>









<!-- ACTIVITY -->


<h2>
Recent Savings Activity
</h2>



<section class="card activity-card"
id="activity-container">


</section>






</div>




<script src="savings.js"></script>


</body>

</html>
